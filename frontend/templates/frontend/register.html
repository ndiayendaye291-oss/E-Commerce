{% extends 'frontend/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 mt-5 fade-in-up">
        <div class="card p-5">
            <h2 class="text-center mb-4 fw-bold" style="letter-spacing: -1px;">Créer un compte</h2>
            <form method="POST" class="auth-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 mt-4 py-3">S'inscrire</button>
            </form>
            <div class="text-center mt-4">
                <p class="text-muted small">Déjà un compte ? <a href="{% url 'login' %}" class="text-warning text-decoration-none fw-bold">Connectez-vous</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
