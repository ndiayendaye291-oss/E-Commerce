{% extends 'frontend/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4 mt-5 fade-in-up">
        <div class="card p-5">
            <h2 class="text-center mb-4 fw-bold" style="letter-spacing: -1px;">Connexion</h2>
            <form method="POST" class="auth-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 mt-3 py-3">Se connecter</button>
            </form>
            <div class="text-center mt-4">
                <p class="text-muted small">Pas encore de compte ? <a href="{% url 'register' %}" class="text-warning text-decoration-none fw-bold">Inscrivez-vous</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
